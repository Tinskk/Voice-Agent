services:
  - type: web
    name: voice-agent
    runtime: python
    rootDir: app
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_TIMEZONE
        sync: false
      - key: BUSINESS_HOURS_JSON
        sync: false
      - key: DELIVERY_ZONES_JSON
        sync: false
      - key: DEFAULT_DELIVERY_FEE
        sync: false
      - key: RESERVATION_SLOT_MINUTES
        value: "30"
      - key: RESERVATION_DEFAULT_DURATION_MINUTES
        value: "90"
      - key: ESCALATION_TRANSFER_NUMBER
        sync: false
